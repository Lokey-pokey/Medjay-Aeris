<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medjay Aeris — Gateway Overview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="topbarMount"></div>
<div class="summary-strip" id="summaryStrip"></div>

<div class="toolbar">
  <div class="filter-chip active" data-f="all"><span class="dot" style="background:var(--text-tertiary)"></span>All</div>
  <div class="filter-chip" data-f="alarm"><span class="dot"></span>Alarm</div>
  <div class="filter-chip" data-f="warn"><span class="dot"></span>Warning</div>
  <div class="filter-chip" data-f="offline"><span class="dot"></span>Offline</div>
  <div class="filter-chip" data-f="ok"><span class="dot"></span>Normal</div>
  <div class="toolbar-spacer"></div>
  <span class="count-label" id="countLabel"></span>
  <select class="sort-select" id="sortSelect">
    <option value="severity">Sort: Severity</option>
    <option value="name">Sort: Name</option>
    <option value="nodes">Sort: Node count</option>
  </select>
</div>

<div class="page">
  <div class="gw-grid" id="gwGrid"></div>
</div>

<div class="toast" id="toast"></div>

<script src="shared.js"></script>
<script>
let activeFilter = "all";
let sortMode = "severity";

document.getElementById('topbarMount').outerHTML = renderTopbar('overview');

function cardHTML(gw){
  const sev = gwSeverity(gw);
  const onlineNodes = gw.nodes.filter(n=>n.online).length;
  const totalNodes = gw.nodes.length;
  // Bucket every node by its single combined severity (nodeSeverity), so
  // counts sum to totalNodes exactly — a node that's offline AND alarming
  // counts once, as an alarm, consistent with how it sorts/filters/badges.
  const ok = gw.nodes.filter(n=>nodeSeverity(n)==="ok").length;
  const amber = gw.nodes.filter(n=>nodeSeverity(n)==="warn").length;
  const red = gw.nodes.filter(n=>nodeSeverity(n)==="alarm").length;
  const offlineN = gw.nodes.filter(n=>nodeSeverity(n)==="offline").length;
  const redUnacked = gw.nodes.filter(n=>n.alarmState==="red" && !n.ack).length;
  const buzzerOnCount = gw.nodes.filter(n=>n.buzzer==="enabled").length;
  const pct = totalNodes ? Math.round((onlineNodes/totalNodes)*100) : 0;
  const badgeMap = {alarm:"ALARM", warn:"WARNING", offline:"OFFLINE", ok:"NORMAL"};

  // Alarm status takes precedence over connectivity in the banner too —
  // an offline gateway with a live red node still needs its alarm surfaced,
  // not hidden behind a generic "offline" message.
  let alarmBanner;
  if(sev === "alarm"){
    alarmBanner = `<div class="alarm-banner active">${ICONS.alert}
      <span>${red} active alarm${red>1?'s':''}</span>
      <span class="ack-tag ${redUnacked>0 ? 'unack' : 'acked'}">${redUnacked>0 ? 'Unacknowledged' : 'Acknowledged'}</span>
    </div>`;
  } else if(!gw.online){
    alarmBanner = `<div class="offline-note">Gateway offline — last seen ${fmtMinutes(gw.lastSeenMinutes)}</div>`;
  } else {
    alarmBanner = `<div class="alarm-banner clear">${ICONS.check}<span>No active alarms</span></div>`;
  }

  return `
  <div class="gw-card state-${sev}" data-id="${gw.id}" data-sev="${sev}" tabindex="0">
    <div class="gw-head">
      <div class="gw-title-block">
        <div class="gw-name-row">
          <span class="status-dot ${gw.online?'online':'offline'}"></span>
          <span class="editable-wrap">
            <span class="gw-name">${gw.name}</span>
            <span class="edit-pencil" data-edit="gw-name" data-gw="${gw.id}" title="Rename gateway">${ICONS.pencil}</span>
          </span>
        </div>
        <div class="gw-location">
          ${ICONS.pin}
          <span class="editable-wrap">
            <span>${gw.location}</span>
            <span class="edit-pencil" data-edit="gw-location" data-gw="${gw.id}" title="Edit location">${ICONS.pencil}</span>
          </span>
        </div>
      </div>
      <span class="health-badge ${sev}">${badgeMap[sev]}</span>
    </div>
    <div class="divider"></div>
    <div class="conn-row">
      <div class="conn-item ${gw.wifi ? 'up':'down'}"><span class="cdot"></span>${ICONS.wifi}<span>WiFi ${gw.wifi?'Connected':'Disconnected'}</span></div>
      <div class="conn-item ${gw.lora ? 'up':'down'}"><span class="cdot"></span>${ICONS.lora}<span>LoRa ${gw.lora?'Connected':'Disconnected'}</span></div>
    </div>
    <div class="nodes-row">
      <div class="row-label"><span>Sensor nodes</span><b>${onlineNodes}/${totalNodes} online</b></div>
      <div class="seg-bar"><div class="seg-online" style="width:${pct}%"></div><div class="seg-offline" style="width:${100-pct}%"></div></div>
    </div>
    <div class="threshold-row">
      <span class="t-item"><span class="tdot g"></span>${ok}</span>
      <span class="t-item"><span class="tdot a"></span>${amber}</span>
      <span class="t-item"><span class="tdot r"></span>${red}</span>
      <span class="t-item"><span class="tdot o"></span>${offlineN}</span>
    </div>
    ${alarmBanner}
    <div class="gw-footer">
      <span class="buzzer-tag ${buzzerOnCount>0 ? 'enabled':'muted'}">${ICONS.speaker} Buzzer ${buzzerOnCount}/${totalNodes} enabled</span>
      <span>Updated ${fmtMinutes(gw.lastSeenMinutes)}</span>
    </div>
  </div>`;
}

function applyFilters(list){
  let out = list;
  if(activeFilter !== "all") out = out.filter(gw => gwSeverity(gw) === activeFilter);
  return out;
}
function applySort(list){
  const copy = [...list];
  if(sortMode === "severity") copy.sort((a,b)=>severityRank(gwSeverity(a))-severityRank(gwSeverity(b)));
  else if(sortMode === "name") copy.sort((a,b)=>a.name.localeCompare(b.name));
  else if(sortMode === "nodes") copy.sort((a,b)=>b.nodes.length-a.nodes.length);
  return copy;
}

function render(){
  const gateways = MedjayData.getGateways();
  document.getElementById('summaryStrip').innerHTML = renderSummaryStripHTML();
  const filtered = applySort(applyFilters(gateways));
  document.getElementById('gwGrid').innerHTML = filtered.map(cardHTML).join('');
  document.getElementById('countLabel').textContent = `${filtered.length} of ${gateways.length} gateways`;

  document.querySelectorAll('.gw-card').forEach(card=>{
    card.addEventListener('click', ()=>{
      window.location.href = `gateway-detail.html?gw=${encodeURIComponent(card.dataset.id)}`;
    });
  });

  document.querySelectorAll('.edit-pencil').forEach(pencil=>{
    pencil.addEventListener('click', (e)=>{
      e.stopPropagation();
      if(!requestEditUnlock()) return;
      const gw = MedjayData.getGateway(pencil.dataset.gw);
      if(!gw) return;
      if(pencil.dataset.edit === 'gw-name'){
        const newName = window.prompt('Gateway name:', gw.name);
        if(newName && newName.trim()){ MedjayData.renameGateway(gw.id, newName.trim()); showToast('Gateway renamed'); render(); }
      } else if(pencil.dataset.edit === 'gw-location'){
        const newLoc = window.prompt('Gateway location:', gw.location);
        if(newLoc && newLoc.trim()){ MedjayData.setLocation(gw.id, newLoc.trim()); showToast('Location updated'); render(); }
      }
    });
  });
}

document.getElementById('sortSelect').addEventListener('change', (e)=>{ sortMode = e.target.value; render(); });
wireGlobalSearch();
document.querySelectorAll('.filter-chip').forEach(chip=>{
  chip.addEventListener('click', ()=>{
    document.querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
    activeFilter = chip.dataset.f;
    render();
  });
});

tickClock(); setInterval(tickClock, 1000);
render();
</script>
</body>
</html>

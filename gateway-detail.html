<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medjay Aeris — Gateway Detail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="topbarMount"></div>
<div class="summary-strip" id="summaryStrip"></div>

<div class="page-header">
  <a class="back-btn" href="index.html">&larr; Overview</a>
  <div class="page-title-row">
    <div>
      <div class="page-title editable-wrap">
        <span id="gwTitle">—</span>
        <span class="edit-pencil" id="gwNamePencil" title="Rename gateway"></span>
      </div>
      <div class="page-title-sub editable-wrap">
        <span id="gwLocation">—</span>
        <span class="edit-pencil" id="gwLocPencil" title="Edit location"></span>
        <span id="gwConnStatus" style="margin-left:8px;"></span>
      </div>
    </div>
  </div>
  <span class="health-badge" id="gwBadge">—</span>
</div>

<div class="toolbar">
  <div class="filter-chip active" data-f="all"><span class="dot" style="background:var(--text-tertiary)"></span>All</div>
  <div class="filter-chip" data-f="alarm"><span class="dot"></span>Alarm</div>
  <div class="filter-chip" data-f="warn"><span class="dot"></span>Warning</div>
  <div class="filter-chip" data-f="offline"><span class="dot"></span>Offline</div>
  <div class="filter-chip" data-f="ok"><span class="dot"></span>Normal</div>
  <div class="toolbar-spacer"></div>
  <span class="count-label" id="countLabel"></span>
</div>

<div class="page">
  <div class="node-grid" id="nodeGrid"></div>
</div>

<div class="toast" id="toast"></div>

<script src="shared.js"></script>
<script>
document.getElementById('topbarMount').outerHTML = renderTopbar('overview');
document.querySelector('.back-btn').innerHTML = ICONS.back + ' Overview';

const params = new URLSearchParams(location.search);
const gwId = params.get('gw');
let activeFilter = "all";

function metricRowColored(label, value, unit, thresholds, key){
  let barCls = 'ok';
  if(thresholds){
    const dir = METRIC_DIRECTION[key] || 'high';
    const isRed = dir === 'low' ? value <= thresholds.red : value >= thresholds.red;
    const isAmber = dir === 'low' ? value <= thresholds.amber : value >= thresholds.amber;
    if(isRed) barCls = 'alarm';
    else if(isAmber) barCls = 'warn';
  }
  const maxRef = {temp:60, humidity:100, smoke:100, aqi:250, battery:100}[key] || 100;
  const pct = Math.max(2, Math.min(100, (value/maxRef)*100));
  return `<div class="metric-row">
    <span class="metric-label">${label}</span>
    <div class="metric-bar-track"><div class="metric-bar-fill ${barCls}" style="width:${pct}%"></div></div>
    <span class="metric-value">${value}${unit}</span>
  </div>`;
}

function nodeCardHTML(n){
  const sev = nodeSeverity(n);
  const badgeMap = {alarm:"ALARM", warn:"WARNING", offline:"OFFLINE", ok:"NORMAL"};
  // Metrics are the last values received from the node whether it's
  // currently online or not — offline no longer hides them, it just labels
  // them as last-known instead of pretending there's nothing to show.
  return `
  <div class="node-card state-${sev}" data-id="${n.id}">
    <div class="node-head">
      <div class="node-name">
        <span class="status-dot ${n.online?'online':'offline'}"></span>
        ${n.name}
      </div>
      <span class="health-badge ${sev}">${badgeMap[sev]}</span>
    </div>
    <div class="node-id">${n.id}</div>
    ${!n.online ? `<div class="offline-note">Offline — last data ${fmtMinutes(n.lastUpdated)}</div>` : ''}
    ${metricRowColored('TEMP', n.temp, '°C', n.thresholds.temp, 'temp')}
    ${metricRowColored('HUMID', n.humidity, '%', n.thresholds.humidity, 'humidity')}
    ${metricRowColored('SMOKE', n.smoke, '', n.thresholds.smoke, 'smoke')}
    ${metricRowColored('AQI', n.aqi, '', n.thresholds.aqi, 'aqi')}
    ${metricRowColored('BATT', n.battery, '%', n.thresholds.battery, 'battery')}
    <div class="gw-footer">
      <span class="buzzer-tag ${n.buzzer==='enabled' ? 'enabled':'muted'}">${ICONS.speaker} ${n.buzzer==='enabled'?'Enabled':'Muted'}</span>
      <span>Updated ${fmtMinutes(n.lastUpdated)}</span>
    </div>
  </div>`;
}

function render(){
  const gw = MedjayData.getGateway(gwId);
  document.getElementById('summaryStrip').innerHTML = renderSummaryStripHTML();
  if(!gw){
    document.getElementById('nodeGrid').innerHTML = `<div class="empty-state">Gateway not found.</div>`;
    return;
  }
  const sev = gwSeverity(gw);
  const badgeMap = {alarm:"ALARM", warn:"WARNING", offline:"OFFLINE", ok:"NORMAL"};
  document.getElementById('gwTitle').textContent = gw.name;
  document.getElementById('gwLocation').textContent = gw.location;
  document.getElementById('gwConnStatus').innerHTML = `${gw.wifi?'WiFi up':'WiFi down'} &nbsp;·&nbsp; ${gw.lora?'LoRa up':'LoRa down'} &nbsp;·&nbsp; Updated ${fmtMinutes(gw.lastSeenMinutes)}`;
  document.getElementById('gwNamePencil').innerHTML = ICONS.pencil;
  document.getElementById('gwLocPencil').innerHTML = ICONS.pencil;
  document.getElementById('gwNamePencil').onclick = ()=>{
    if(!requestEditUnlock()) return;
    const newName = window.prompt('Gateway name:', gw.name);
    if(newName && newName.trim()){ MedjayData.renameGateway(gw.id, newName.trim()); showToast('Gateway renamed'); render(); }
  };
  document.getElementById('gwLocPencil').onclick = ()=>{
    if(!requestEditUnlock()) return;
    const newLoc = window.prompt('Gateway location:', gw.location);
    if(newLoc && newLoc.trim()){ MedjayData.setLocation(gw.id, newLoc.trim()); showToast('Location updated'); render(); }
  };
  const badgeEl = document.getElementById('gwBadge');
  badgeEl.textContent = badgeMap[sev];
  badgeEl.className = `health-badge ${sev}`;

  let nodes = gw.nodes;
  if(activeFilter !== "all") nodes = nodes.filter(n => nodeSeverity(n) === activeFilter);

  document.getElementById('nodeGrid').innerHTML = nodes.map(nodeCardHTML).join('') || `<div class="empty-state">No sensor nodes match this filter.</div>`;
  document.getElementById('countLabel').textContent = `${nodes.length} of ${gw.nodes.length} sensor nodes`;

  document.querySelectorAll('.node-card').forEach(card=>{
    card.addEventListener('click', ()=>{
      window.location.href = `sensor-detail.html?node=${encodeURIComponent(card.dataset.id)}`;
    });
  });
}

document.querySelectorAll('.filter-chip').forEach(chip=>{
  chip.addEventListener('click', ()=>{
    document.querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
    activeFilter = chip.dataset.f;
    render();
  });
});

tickClock(); setInterval(tickClock, 1000);
wireGlobalSearch();
render();
</script>
</body>
</html>

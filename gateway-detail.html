<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medjay Aeris — Gateway Detail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="topbarMount"></div>
<div class="summary-strip" id="summaryStrip"></div>

<div class="page-header">
  <a class="back-btn" href="index.html">&larr; Overview</a>
  <div class="page-title-row">
    <div>
      <div class="page-title" id="gwTitle">—</div>
      <div class="page-title-sub" id="gwLocation">—</div>
    </div>
  </div>
  <span class="health-badge" id="gwBadge">—</span>
</div>

<div class="toolbar">
  <div class="filter-chip active" data-f="all"><span class="dot" style="background:var(--text-tertiary)"></span>All</div>
  <div class="filter-chip" data-f="alarm"><span class="dot"></span>Alarm</div>
  <div class="filter-chip" data-f="warn"><span class="dot"></span>Warning</div>
  <div class="filter-chip" data-f="offline"><span class="dot"></span>Offline</div>
  <div class="filter-chip" data-f="ok"><span class="dot"></span>Normal</div>
  <div class="toolbar-spacer"></div>
  <span class="count-label" id="countLabel"></span>
  <span class="count-label" id="queueLabel"></span>
</div>

<div class="page">
  <div class="node-grid" id="nodeGrid"></div>
</div>

<div class="toast" id="toast"></div>

<script src="shared.js"></script>
<script>
document.getElementById('topbarMount').outerHTML = renderTopbar('overview');
document.querySelector('.back-btn').innerHTML = ICONS.back + ' Overview';

const params = new URLSearchParams(location.search);
const gwId = params.get('gw');
const gw = GatewayRegistry.get(gwId);
let activeFilter = "all";

function metricRow(label, value, unit, barCls, maxRef, thresholdVal){
  const pct = Math.max(2, Math.min(100, (Math.abs(value)/maxRef)*100));
  const tickPct = thresholdVal != null ? Math.max(0, Math.min(100, (Math.abs(thresholdVal)/maxRef)*100)) : null;
  return `<div class="metric-row">
    <span class="metric-label">${label}</span>
    <div class="metric-bar-track">
      <div class="metric-bar-fill ${barCls}" style="width:${pct}%"></div>
      ${tickPct!=null ? `<div class="threshold-tick" style="left:${tickPct}%" title="Local early-warning line: ${thresholdVal}${unit}"></div>` : ''}
    </div>
    <span class="metric-value">${value}${unit}</span>
  </div>`;
}

function nodeCardHTML(n){
  const sev = nodeSeverity(n);
  const badgeMap = {alarm:"ALARM", warn:"WARNING", offline:"OFFLINE", ok:"NORMAL"};
  const buzzerCmd = LocalBuzzer.get(gwId, n.id);
  return `
  <div class="node-card state-${sev}" data-id="${n.id}">
    <div class="node-head">
      <div class="node-name">
        <span class="status-dot ${n.online?'online':'offline'}"></span>
        Node ${n.id}
      </div>
      <span class="health-badge ${sev}">${badgeMap[sev]}</span>
    </div>
    <div class="node-id">RSSI ${n.rssi ?? '—'} dBm · SNR ${n.snr ?? '—'} dB</div>
    ${!n.online ? `<div class="offline-note">Offline — last seen ${fmtAgo(n.last_seen)}</div>` : ''}
    ${metricRow('TEMP', n.temperature, '°C', barClsFor('temp', n), 60, LocalThresholds.get(gwId, n.id).temperature.amber)}
    ${metricRow('HUMID', n.humidity, '%', barClsFor('humidity', n), 100, LocalThresholds.get(gwId, n.id).humidity.amber)}
    ${metricRow('SMOKE', n.smoke, '', barClsFor('smoke', n), 300, LocalThresholds.get(gwId, n.id).smoke.amber)}
    ${metricRow('BATT', n.battery, '%', barClsFor('battery', n), 100, LocalThresholds.get(gwId, n.id).battery.amber)}
    <div class="gw-footer">
      <span class="buzzer-tag ${buzzerCmd===true ? 'enabled':'muted'}">${ICONS.speaker} ${buzzerCmd===null ? 'Unknown' : (buzzerCmd ? 'Enabled':'Muted')}${buzzerCmd!==null?' (last cmd)':''}</span>
      <span>Updated ${fmtAgo(n.last_seen)}</span>
    </div>
  </div>`;
}

async function render(){
  document.getElementById('summaryStrip').innerHTML = renderSummaryStripHTML();
  if(!gw){
    document.getElementById('nodeGrid').innerHTML = `<div class="empty-state">Gateway not registered. Go back and register it from the Overview page.</div>`;
    return;
  }
  ensurePolling(gw);
  const entry = LiveStore.get(gw.id);
  const sev = gwSeverity(gw.id);
  const badgeMap = {alarm:"ALARM", warn:"WARNING", offline:"OFFLINE", ok:"NORMAL"};
  document.getElementById('gwTitle').textContent = gw.name;
  document.getElementById('gwLocation').textContent = `${gw.location} · ${gw.baseUrl}`;
  const badgeEl = document.getElementById('gwBadge');
  badgeEl.textContent = badgeMap[sev];
  badgeEl.className = `health-badge ${sev}`;

  let nodes = entry.nodes || [];
  if(activeFilter !== "all") nodes = nodes.filter(n => nodeSeverity(n) === activeFilter);

  document.getElementById('nodeGrid').innerHTML = nodes.map(nodeCardHTML).join('') || `<div class="empty-state">${entry.lastError ? 'Gateway unreachable — ' + entry.lastError : 'No sensor nodes match this filter.'}</div>`;
  document.getElementById('countLabel').textContent = `${nodes.length} of ${(entry.nodes||[]).length} sensor nodes`;

  const q = await fetchQueue(gw);
  document.getElementById('queueLabel').textContent = q.ok ? `${q.data.pending||0} command(s) queued` : '';

  document.querySelectorAll('.node-card').forEach(card=>{
    card.addEventListener('click', ()=>{
      window.location.href = `sensor-detail.html?gw=${encodeURIComponent(gwId)}&node=${encodeURIComponent(card.dataset.id)}`;
    });
  });
}

document.querySelectorAll('.filter-chip').forEach(chip=>{
  chip.addEventListener('click', ()=>{
    document.querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
    activeFilter = chip.dataset.f;
    render();
  });
});

tickClock(); setInterval(tickClock, 1000);
wireGlobalSearch();
render();
setInterval(render, 5000);
</script>
</body>
</html>

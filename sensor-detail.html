<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medjay Aeris — Sensor Detail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="topbarMount"></div>
<div class="summary-strip" id="summaryStrip"></div>

<div class="page-header">
  <a class="back-btn" id="backBtn" href="index.html">&larr; Gateway</a>
  <div class="page-title-row">
    <div>
      <div class="page-title" id="nodeTitle">—</div>
      <div class="page-title-sub" id="nodeSub">—</div>
    </div>
  </div>
  <span class="health-badge" id="nodeBadge">—</span>
</div>

<div class="detail-grid">
  <div class="panel">
    <div class="panel-title">Live Values <span style="font-weight:400; text-transform:none; color:var(--text-tertiary); font-size:11px;">GET /api/node/&lt;id&gt;</span></div>
    <div id="liveValues"></div>
    <div id="offlineNotice"></div>
  </div>

  <div class="panel">
    <div class="panel-title">Configuration &amp; Commands</div>
    <div id="configPanel"></div>
  </div>

  <div class="panel" style="grid-column:1 / -1;">
    <div class="panel-title">
      Recent History (last 30s poll — GET /api/history/&lt;id&gt;)
      <span class="count-label" id="historyCount"></span>
    </div>
    <div class="table-wrap">
      <table class="log-table">
        <thead><tr><th>Time</th><th>Temp °C</th><th>Humidity %</th><th>Smoke</th><th>Battery %</th></tr></thead>
        <tbody id="historyBody"></tbody>
      </table>
    </div>
  </div>

  <div class="panel" style="grid-column:1 / -1;">
    <div class="panel-title">
      Local Event Log
      <span class="count-label" id="logCount"></span>
    </div>
    <div class="log-toolbar" style="padding:0 0 8px;">
      <span class="empty-state" style="padding:0; font-size:11px; text-align:left;">Server-side /api/logs is reserved (not yet implemented) — this log is recorded locally in this browser.</span>
    </div>
    <div class="table-wrap">
      <table class="log-table">
        <thead><tr><th>Time</th><th>Event</th><th>User</th></tr></thead>
        <tbody id="nodeLogBody"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="shared.js"></script>
<script>
document.getElementById('topbarMount').outerHTML = renderTopbar('overview');

const params = new URLSearchParams(location.search);
const gwId = params.get('gw');
const nodeId = params.get('node');
const gw = GatewayRegistry.get(gwId);

function metricRowLg(label, value, unit, barCls, maxRef, thresholdVal){
  const pct = Math.max(2, Math.min(100, (Math.abs(value)/maxRef)*100));
  const tickPct = thresholdVal != null ? Math.max(0, Math.min(100, (Math.abs(thresholdVal)/maxRef)*100)) : null;
  return `<div class="metric-row lg">
    <span class="metric-label">${label}</span>
    <div class="metric-bar-track">
      <div class="metric-bar-fill ${barCls}" style="width:${pct}%"></div>
      ${tickPct!=null ? `<div class="threshold-tick" style="left:${tickPct}%" title="Local early-warning line: ${thresholdVal}${unit}"></div>` : ''}
    </div>
    <span class="metric-value">${value}${unit}</span>
  </div>`;
}
function thresholdRow(label, key, unit){
  const t = LocalThresholds.get(gwId, nodeId);
  return `<div class="config-row" data-threshold="${key}">
    <span class="form-label">${label} early-warning line${unit?` (${unit})`:''}</span>
    <span class="editable-wrap">
      <span class="config-value" data-display="${key}">${t[key].amber}</span>
      <span class="edit-pencil" data-edit-threshold="${key}" role="button" tabindex="0" aria-label="Edit local ${label.toLowerCase()} early-warning line" title="Edit local ${label.toLowerCase()} preview line">${ICONS.pencil}</span>
    </span>
  </div>`;
}

let latestNode = null;

async function render(){
  document.getElementById('summaryStrip').innerHTML = renderSummaryStripHTML();
  if(!gw){
    document.getElementById('liveValues').innerHTML = `<div class="empty-state">Gateway not registered.</div>`;
    document.getElementById('configPanel').innerHTML = '';
    return;
  }
  document.getElementById('backBtn').href = `gateway-detail.html?gw=${encodeURIComponent(gw.id)}`;
  document.getElementById('backBtn').innerHTML = `${ICONS.back} ${gw.name}`;

  const res = await fetchNode(gw, nodeId);
  if(!res.ok){
    document.getElementById('liveValues').innerHTML = `<div class="empty-state">Could not reach node — ${res.error}</div>`;
    return;
  }
  const node = res.data;
  latestNode = node;
  const sev = nodeSeverity(node);
  const badgeMap = {alarm:"ALARM", warn:"WARNING", offline:"OFFLINE", ok:"NORMAL"};
  document.getElementById('nodeTitle').textContent = `Node ${node.id}`;
  document.getElementById('nodeSub').innerHTML = `RSSI ${node.rssi ?? '—'} dBm &nbsp;·&nbsp; SNR ${node.snr ?? '—'} dB &nbsp;·&nbsp; Counter ${node.counter ?? '—'} &nbsp;·&nbsp; ${gw.name} — ${gw.location}`;
  const badgeEl = document.getElementById('nodeBadge');
  badgeEl.textContent = badgeMap[sev];
  badgeEl.className = `health-badge ${sev}`;

  document.getElementById('offlineNotice').innerHTML = !node.online
    ? `<div class="offline-note">This node is currently offline. Values below are the last readings received.</div>` : '';

  document.getElementById('liveValues').innerHTML = `
    ${(()=>{ const t = LocalThresholds.get(gwId, nodeId); return `
    ${metricRowLg('Temperature', node.temperature, '°C', barClsFor('temp', node), 60, t.temperature.amber)}
    ${metricRowLg('Humidity', node.humidity, '%', barClsFor('humidity', node), 100, t.humidity.amber)}
    ${metricRowLg('Smoke (ADC)', node.smoke, '', barClsFor('smoke', node), 300, t.smoke.amber)}
    ${metricRowLg('Battery', node.battery, '%', barClsFor('battery', node), 100, t.battery.amber)}
    `; })()}
  `;

  const f = decodeFlags(node.flags);
  const buzzerCmd = LocalBuzzer.get(gwId, nodeId);
  document.getElementById('configPanel').innerHTML = `
    <div class="config-row"><span class="form-label">Device alarm flags</span><span class="config-value" style="font-family:var(--mono); font-weight:400;">
      ${['smoke','temp','humidity','batteryLow','loraError'].filter(k=>f[k]).join(', ') || 'none set'}
    </span></div>
    ${thresholdRow('Temperature', 'temperature', '°C')}
    ${thresholdRow('Humidity', 'humidity', '%')}
    ${thresholdRow('Smoke', 'smoke')}
    ${thresholdRow('Battery', 'battery', '%')}
    <div class="config-row">
      <span class="form-label">Alarm output (buzzer)</span>
      <span class="config-value">${buzzerCmd===null ? 'Unknown — never commanded' : (buzzerCmd ? 'Enabled (last commanded, unconfirmed)' : 'Disabled (last commanded, unconfirmed)')}</span>
    </div>
    <div class="btn-row">
      <button class="btn" id="pingBtn">Ping</button>
      <button class="btn" id="enableAlarmBtn">Enable Alarm</button>
      <button class="btn" id="disableAlarmBtn">Disable Alarm</button>
      <button class="btn danger" id="rebootBtn">Reboot</button>
      <button class="btn danger" id="resetBtn">Factory Reset</button>
    </div>
  `;

  document.querySelectorAll('[data-edit-threshold]').forEach(pencil=>{
    const openEditor = ()=>{
      const key = pencil.dataset.editThreshold;
      const t = LocalThresholds.get(gwId, nodeId);
      const val = window.prompt(`Local early-warning line for ${key} (informational only — does not change device alarm state):`, t[key].amber);
      if(val === null) return;
      const num = Number(val);
      if(Number.isNaN(num)){ window.alert('Enter a valid number.'); return; }
      t[key] = { amber: num };
      LocalThresholds.set(gwId, nodeId, t);
      addLog({gateway:gwId, sensor:nodeId, event:"Local Threshold Preview Changed", user:"admin"});
      showToast('Local preview line updated');
      render();
    };
    pencil.addEventListener('click', openEditor);
    pencil.addEventListener('keydown', (e)=>{
      if(e.key==='Enter' || e.key===' '){ e.preventDefault(); openEditor(); }
    });
  });

  async function runCommand(command, {destructive=false}={}){
    if(destructive && !requestEditUnlock()) return;
    if(destructive && !window.confirm(`Send ${command} to node ${nodeId}? This affects the physical device.`)) return;
    const res = await sendCommand(gw, nodeId, command);
    showToast(res.ok ? `${command} sent — queued` : `${command} failed — ${res.error}`);
    render();
  }
  document.getElementById('pingBtn').onclick = ()=>runCommand('PING');
  document.getElementById('enableAlarmBtn').onclick = ()=>runCommand('ENABLE_ALARM');
  document.getElementById('disableAlarmBtn').onclick = ()=>runCommand('DISABLE_ALARM');
  document.getElementById('rebootBtn').onclick = ()=>runCommand('REBOOT', {destructive:true});
  document.getElementById('resetBtn').onclick = ()=>runCommand('FACTORY_RESET', {destructive:true});

  // History (30s cadence per spec — only fetched here, not on every 5s tick)
  if(!render._lastHistoryFetch || Date.now()-render._lastHistoryFetch > POLL_MS.history){
    render._lastHistoryFetch = Date.now();
    const h = await fetchHistory(gw, nodeId);
    render._history = h.ok && Array.isArray(h.data) ? h.data : [];
  }
  const hist = render._history || [];
  document.getElementById('historyCount').textContent = `${hist.length} point${hist.length===1?'':'s'}`;
  document.getElementById('historyBody').innerHTML = hist.length ? hist.slice().reverse().map(p => `
    <tr><td>${fmtTs(p.timestamp*1000)}</td><td>${p.temperature}</td><td>${p.humidity}</td><td>${p.smoke}</td><td>${p.battery}</td></tr>
  `).join('') : `<tr><td colspan="5" class="empty-state">No history returned yet.</td></tr>`;

  // Local event log for this node
  const logs = getLogs().filter(l => l.sensor === String(nodeId) && l.gateway === gwId);
  document.getElementById('logCount').textContent = `${logs.length} event${logs.length===1?'':'s'}`;
  document.getElementById('nodeLogBody').innerHTML = logs.length ? logs.map(l => `
    <tr><td>${fmtTs(l.ts)}</td><td>${l.event}</td><td>${l.user||'—'}</td></tr>
  `).join('') : `<tr><td colspan="3" class="empty-state">No events recorded for this node yet.</td></tr>`;
}

tickClock(); setInterval(tickClock, 1000);
wireGlobalSearch();
render();
setInterval(render, 5000);
</script>
</body>
</html>
